<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ignore Vite HMR WebSocket connection errors per environment guidelines
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) ||
          (typeof e.reason.stack === 'string' && e.reason.stack.includes('createWebSocketModuleRunnerTransport'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (
          (typeof e.message === 'string' && e.message.includes('WebSocket')) ||
          (typeof e.filename === 'string' && e.filename.includes('@vite/client'))
        ) {
          e.preventDefault();
        }
      });
    </script>
