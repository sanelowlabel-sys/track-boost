  <rect x="10" y="10" width="100" height="100" rx="8" fill="#7FB823" />
  <text x="60" y="85" font-family="'Impact', 'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="78" fill="#111111" text-anchor="middle" filter="url(#icon-grunge)">J</text>
</svg>
